# Fichier docker-compose pour l'orchestrateur Didier et ses services.
# Inspiré par une architecture robuste et persistante de type OctoBot.
# Taux de remplissage des disques (df -h) : / 138GO/229GO, /mnt/didier_ssd 0GO/916GO

services:
  # Service 1: Le cerveau de Didier, l'orchestrateur applicatif.
  didier-brain:
    build: .
    container_name: didier-brain
    restart: unless-stopped

    # network_mode: host est crucial ici. Il supprime l'isolation réseau entre
    # le conteneur et l'hôte, donnant à Didier un accès direct aux services
    # de l'hôte (comme PulseAudio/PipeWire) et simplifiant la découverte Bluetooth.
    network_mode: "host"
    entrypoint: ["/app/scripts/entrypoint_didier.sh"]
    
    # COMMANDE EXPLICITE : Lancement orchestrateur sur le port 5003
    command: python3 /app/didier_orchestrator.py --port 5003
    
    # Privileged est souvent nécessaire pour un accès bas niveau au matériel
    # depuis un conteneur, notamment pour certains périphériques /dev.
    privileged: true
    pid: "host"
    group_add:
      - "44"
      - "992"

    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      # Ajout de /app au PYTHONPATH pour trouver les modules locaux (router_*, audio_service)
      - PYTHONPATH=/app:/usr/lib/python3/dist-packages
      - DIDIER_LOG_DIR=/app/logs
      - DIDIER_LOG_LEVEL=INFO
      - DIDIER_LOG_ROTATE_MB=25
      - DIDIER_LOG_BACKUPS=14
      - OLLAMA_HOST=127.0.0.1:11435

    volumes:
      # --- Persistance des données et du code ---
      # Le mapping du répertoire courant permet de voir les modifications du code en direct.
      # CORRECTION : Le chemin pointait vers le mauvais dossier, empêchant de voir les modifications.
      - /mnt/didier_ssd/didier/workspace/Didier:/app
      # Mapping des dossiers de configuration, de voix, et de logs.
      - /mnt/didier_ssd/didier/workspace/Didier/config:/app/config
      - /mnt/didier_ssd/didier/models/tts:/app/voices
      - /mnt/didier_ssd/didier/models/hailo:/app/models/hailo
      - /mnt/didier_ssd/didier/models/vision:/app/models/vision
      - /mnt/didier_ssd/didier/logs:/app/logs
      # Accès en lecture seule au FS hôte pour les métriques disques réelles.
      - /:/host:ro
      
      # --- Bridge Audio & Bluetooth ---
      # Partage du socket PulseAudio de l'utilisateur hôte (ID 1000)
      # pour que paplay dans le conteneur puisse parler à la Soundboks via l'hôte.
      - /run/user/1000/pulse:/run/user/1000/pulse
      - /var/run/dbus:/var/run/dbus
      # --- Hailo runtime + Python (depuis l'hôte) ---
      - /usr/lib/python3/dist-packages/hailo_platform:/usr/lib/python3/dist-packages/hailo_platform:ro
      - /usr/lib/python3/dist-packages/hailo.cpython-313-aarch64-linux-gnu.so:/usr/lib/python3/dist-packages/hailo.cpython-313-aarch64-linux-gnu.so:ro
      - /lib/libhailort.so:/lib/libhailort.so:ro
      - /lib/libhailort.so.4.23.0:/lib/libhailort.so.4.23.0:ro
      - /lib/aarch64-linux-gnu/libhailo_tracker.so:/lib/aarch64-linux-gnu/libhailo_tracker.so:ro
      - /lib/aarch64-linux-gnu/libhailo_tracker.so.5:/lib/aarch64-linux-gnu/libhailo_tracker.so.5:ro
      - /lib/aarch64-linux-gnu/libhailo_gst_image.so:/lib/aarch64-linux-gnu/libhailo_gst_image.so:ro
      - /lib/aarch64-linux-gnu/libhailo_gst_image.so.5:/lib/aarch64-linux-gnu/libhailo_gst_image.so.5:ro
      - /lib/aarch64-linux-gnu/libhailo_cv_singleton.so:/lib/aarch64-linux-gnu/libhailo_cv_singleton.so:ro
      - /lib/aarch64-linux-gnu/libhailo_cv_singleton.so.5:/lib/aarch64-linux-gnu/libhailo_cv_singleton.so.5:ro
      - /lib/aarch64-linux-gnu/libgsthailometa.so:/lib/aarch64-linux-gnu/libgsthailometa.so:ro
      - /lib/aarch64-linux-gnu/libgsthailometa.so.5:/lib/aarch64-linux-gnu/libgsthailometa.so.5:ro
      
    devices:
      # --- Mapping du matériel ---
      - /dev/video0:/dev/video0    # Caméra PS3 Eye
      - /dev/hailo0:/dev/hailo0    # NPU Hailo-8L
      - /dev/snd:/dev/snd          # Périphérique son
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
      
  # Service 2: Le modèle de langage local, Ollama.
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      # Exposition du port d'Ollama sur l'hôte (évite le conflit avec ollama.service).
      - "11435:11434"
    volumes:
      # Persistance des modèles téléchargés par Ollama.
      - /mnt/didier_ssd/didier/ollama:/root/.ollama
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  reverse-proxy:
    image: nginx:alpine
    container_name: didier-proxy
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - didier-brain
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./key.pem:/etc/nginx/certs/key.pem:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  vscode:
    image: codercom/code-server:latest
    container_name: didier-vscode
    restart: unless-stopped
    network_mode: "host"
    user: "1000:1000"
    command:
      [
        "code-server",
        "--bind-addr",
        "0.0.0.0:8080",
        "--auth",
        "none",
        "/home/coder/project"
      ]
    environment:
      - OLLAMA_HOST=127.0.0.1:11435
      - DIDIER_OLLAMA_URL=http://127.0.0.1:11435
      - DIDIER_API_BASE=http://127.0.0.1:8000
    volumes:
      - /mnt/didier_ssd/didier/workspace/Didier:/home/coder/project
      - /mnt/didier_ssd/didier/vscode:/home/coder/.local/share/code-server
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
